<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Login | Inventory Management System</title>
<link href="assets/img/logo.svg" rel="icon"/>
<link href="assets/css/style.css" rel="stylesheet"/>
</head>
<body>
<main class="login-page">
<section class="login-art">
<div class="login-art-inner">
<img alt="Inventory Management System inventory logo" src="assets/img/logo.svg"/>
<p class="small-label" style="color:#f3b94d">
      INVENTORY MANAGEMENT SYSTEM
     </p>
<h1>
      Track. Manage.
      <br/>
      Stay in control.
     </h1>
<p>
      Keep inventory visible, organised and ready for your next business decision.
     </p>
</div>
</section>
<section class="login-panel">
<div class="login-card">
<p class="eyebrow">
      Welcome back
     </p>
<h1>
      Sign in to your account
     </h1>
<p class="subtitle">
      Enter your details to continue to the dashboard.
     </p>
<form action="index.html" method="get">
<div class="field">
<label for="username">
        Username
       </label>
<input autocomplete="username" id="username" placeholder="Enter username" type="text"/>
</div>
<div class="field">
<label for="password">
        Password
       </label>
<input autocomplete="current-password" id="password" placeholder="Enter password" type="password"/>
</div>
<button class="btn" style="width:100%;margin-top:12px" type="submit">
       Sign In →
      </button>
</form>
</div>
</section>
</main>
</body>
</html>
